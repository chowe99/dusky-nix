# Daily sync of upstream dusky (the non-flake `dusky-dotfiles` input).
#
# Bumps flake.lock, then validates the port against the new upstream: the
# flake's checks evaluate, the runtime-deps audit and dusky-scripts-all build
# (upstream renames/moves surface here as missing files or commands), and
# both NixOS configurations evaluate. Only then is the new lock committed to
# master. On failure nothing is committed and one labelled issue collects the
# reports. No full system closure is built (runners have ~14 GB of disk).
name: upstream-sync

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FAILURE_LABEL: upstream-sync-failure
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://attic.xuyh0120.win/lantian
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

      - name: Update dusky-dotfiles
        id: update
        run: |
          rev() { jq -r '.nodes."dusky-dotfiles".locked.rev' flake.lock; }
          old=$(rev)
          nix flake update dusky-dotfiles
          new=$(rev)
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- flake.lock; then
            echo "Upstream unchanged at ${old:0:7}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream ${old:0:7}..${new:0:7}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate
        id: validate
        if: steps.update.outputs.changed == 'true'
        run: |
          set -o pipefail
          check() {
            local name=$1; shift
            echo "::group::$name"
            if ! "$@" 2>&1 | tee -a validate.log; then
              echo "::endgroup::"
              echo "failed_step=$name" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::endgroup::"
          }
          sys=x86_64-linux
          check "nix flake check (eval only)" nix flake check --no-build
          check "build dusky-scripts-all" nix build --no-link -L ".#packages.$sys.dusky-scripts-all"
          check "runtime-deps audit" nix build --no-link -L ".#checks.$sys.runtime-deps"
          check "eval will" nix eval --raw ".#nixosConfigurations.will.config.system.build.toplevel.drvPath"
          check "eval default" nix eval --raw ".#nixosConfigurations.default.config.system.build.toplevel.drvPath"
          df -h /

      - name: Commit flake.lock
        if: steps.update.outputs.changed == 'true'
        env:
          OLD: ${{ steps.update.outputs.old }}
          NEW: ${{ steps.update.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: sync upstream dusky ${OLD:0:7}..${NEW:0:7}"
          git push origin HEAD:master

      - name: Report failure
        if: failure() && steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.update.outputs.old }}
          NEW: ${{ steps.update.outputs.new }}
          STEP: ${{ steps.validate.outputs.failed_step || 'commit/push' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Upstream dusky \`${OLD:0:7}..${NEW:0:7}\` ([compare](https://github.com/dusklinux/dusky/compare/${OLD}...${NEW})) failed at **${STEP}**. flake.lock was not changed."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            tail -n 60 validate.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > body.md
          gh label create "$FAILURE_LABEL" --color B60205 \
            --description "The daily upstream dusky sync failed validation" 2>/dev/null || true
          issue=$(gh issue list --label "$FAILURE_LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --label "$FAILURE_LABEL" \
              --title "Upstream dusky sync failing" --body-file body.md
          fi
